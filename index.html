<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماشین حساب ساده</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .calculator {
            background: #2c3e50;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 350px;
        }

        .display {
            background: #1a252f;
            color: white;
            font-size: 40px;
            text-align: left;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            min-height: 80px;
            word-wrap: break-word;
            word-break: break-all;
            direction: ltr;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            border: none;
            outline: none;
            font-size: 24px;
            border-radius: 10px;
            cursor: pointer;
            padding: 20px;
            transition: 0.2s;
            color: white;
        }

        button:active {
            transform: scale(0.95);
        }

        .num-btn {
            background: #34495e;
        }
        .num-btn:hover {
            background: #3d566e;
        }

        .op-btn {
            background: #e67e22;
        }
        .op-btn:hover {
            background: #d35400;
        }

        .equals-btn {
            background: #27ae60;
        }
        .equals-btn:hover {
            background: #2ecc71;
        }

        .clear-btn {
            background: #c0392b;
        }
        .clear-btn:hover {
            background: #e74c3c;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="buttons">
            <button class="clear-btn" onclick="clearDisplay()">C</button>
            <button class="op-btn" onclick="appendOperator('/')">÷</button>
            <button class="op-btn" onclick="appendOperator('*')">×</button>
            <button class="op-btn" onclick="appendOperator('-')">-</button>

            <button class="num-btn" onclick="appendNumber('7')">7</button>
            <button class="num-btn" onclick="appendNumber('8')">8</button>
            <button class="num-btn" onclick="appendNumber('9')">9</button>
            <button class="op-btn" onclick="appendOperator('+')">+</button>

            <button class="num-btn" onclick="appendNumber('4')">4</button>
            <button class="num-btn" onclick="appendNumber('5')">5</button>
            <button class="num-btn" onclick="appendNumber('6')">6</button>
            <button class="num-btn" onclick="appendNumber('.')">.</button>

            <button class="num-btn" onclick="appendNumber('1')">1</button>
            <button class="num-btn" onclick="appendNumber('2')">2</button>
            <button class="num-btn" onclick="appendNumber('3')">3</button>
            <button class="equals-btn" onclick="calculate()">=</button>

            <button class="num-btn" style="grid-column: span 3;" onclick="appendNumber('0')">0</button>
            <!-- دکمه = به ردیف بالا منتقل شد تا چیدمان درست شود -->
        </div>
    </div>

    <script>
        let currentInput = '0';
        let shouldResetScreen = false;

        function updateDisplay() {
            const display = document.getElementById('display');
            display.innerText = currentInput;
        }

        function appendNumber(number) {
            if (currentInput === '0' || shouldResetScreen) {
                currentInput = number;
                shouldResetScreen = false;
            } else {
                currentInput += number;
            }
            updateDisplay();
        }

        function appendOperator(operator) {
            const lastChar = currentInput.slice(-1);
            // جلوگیری از زدن دو عملگر پشت سر هم
            if (['+', '-', '*', '/'].includes(lastChar)) {
                currentInput = currentInput.slice(0, -1) + operator;
            } else {
                currentInput += operator;
            }
            shouldResetScreen = false;
            updateDisplay();
        }

        function clearDisplay() {
            currentInput = '0';
            updateDisplay();
        }

        function calculate() {
            try {
                // eval تابع ریاضی داخلی است که محاسبات را انجام می‌دهد
                // ما از آن استفاده می‌کنیم چون فقط 4 عمل اصلی داریم
                let result = eval(currentInput);
                
                // بررسی خطای تقسیم بر صفر
                if (result === Infinity || result === -Infinity) {
                    currentInput = 'خطا!';
                } else {
                    // گرد کردن اعداد اعشاری طولانی
                    currentInput = parseFloat(result.toFixed(10)).toString();
                }
            } catch (error) {
                currentInput = 'خطا!';
            }
            shouldResetScreen = true;
            updateDisplay();
        }
    </script>
</body>
              </html>
