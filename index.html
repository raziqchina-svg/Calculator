<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ماشین حساب مدرن</title>
    
    <!-- اتصال به فایل PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f2027">
    
    <style>
        /* تنظیمات کلی */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        /* پس زمینه تمام صفحه با گرادیانت جذاب */
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* جلوگیری از اسکرول شدن */
        }

        /* بدنه ماشین حساب */
        .calculator {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            width: 100%;
            max-width: 400px;
            height: 100vh; /* پر کردن کل ارتفاع */
            max-height: 800px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5);
        }

        /* صفحه نمایش */
        .display {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 20px;
            color: #fff;
            direction: ltr; /* اعداد از چپ به راست نوشته شوند */
            overflow: hidden;
        }

        .previous-operand {
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.5);
            min-height: 30px;
            margin-bottom: 10px;
        }

        .current-operand {
            font-size: 4rem;
            font-weight: 300;
            letter-spacing: 2px;
            word-wrap: break-word;
            word-break: break-all;
            text-align: right;
            max-width: 100%;
        }

        /* بخش دکمه ها */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding-bottom: 20px;
        }

        /* استایل کلی دکمه ها */
        button {
            border: none;
            outline: none;
            border-radius: 50%; /* دکمه های گرد */
            font-size: 1.8rem;
            font-weight: 500;
            height: 75px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: scale(0.9);
        }

        /* دکمه های اعداد */
        .num-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .num-btn:hover { background: rgba(255, 255, 255, 0.2); }

        /* دکمه های عملگر (نارنجی) */
        .op-btn {
            background: #ff9f0a;
            color: #fff;
            font-size: 2rem;
        }
        .op-btn:hover { background: #ffb03a; }

        /* دکمه مساوی (سبز) */
        .equals-btn {
            background: #30d158;
            font-size: 2rem;
        }
        .equals-btn:hover { background: #42e06a; }

        /* دکمه پاک کردن (قرمز) */
        .clear-btn {
            background: rgba(255, 69, 58, 0.8);
            color: white;
        }
        .clear-btn:hover { background: rgba(255, 69, 58, 1); }

        /* دکمه صفر که دو خانه را اشغال می کند */
        .zero-btn {
            grid-column: span 2;
            border-radius: 40px; /* کشیده */
            justify-content: flex-start;
            padding-left: 30px;
        }

    </style>
</head>
<body>

    <div class="calculator">
        <div class="display">
            <div class="previous-operand" id="previous-operand"></div>
            <div class="current-operand" id="current-operand">0</div>
        </div>

        <div class="buttons">
            <!-- دکمه های ردیف اول -->
            <button class="clear-btn" onclick="clearAll()">C</button>
            <button class="op-btn" onclick="deleteNumber()">⌫</button>
            <button class="op-btn" onclick="chooseOperation('/')">÷</button>
            <button class="op-btn" onclick="chooseOperation('*')">×</button>

            <!-- ردیف دوم -->
            <button class="num-btn" onclick="appendNumber('7')">7</button>
            <button class="num-btn" onclick="appendNumber('8')">8</button>
            <button class="num-btn" onclick="appendNumber('9')">9</button>
            <button class="op-btn" onclick="chooseOperation('-')">−</button>

            <!-- ردیف سوم -->
            <button class="num-btn" onclick="appendNumber('4')">4</button>
            <button class="num-btn" onclick="appendNumber('5')">5</button>
            <button class="num-btn" onclick="appendNumber('6')">6</button>
            <button class="op-btn" onclick="chooseOperation('+')">+</button>

            <!-- ردیف چهارم -->
            <button class="num-btn" onclick="appendNumber('1')">1</button>
            <button class="num-btn" onclick="appendNumber('2')">2</button>
            <button class="num-btn" onclick="appendNumber('3')">3</button>
            <button class="equals-btn" onclick="calculate()">=</button>

            <!-- ردیف پنجم -->
            <button class="num-btn zero-btn" onclick="appendNumber('0')">0</button>
            <button class="num-btn" onclick="appendNumber('.')">.</button>
        </div>
    </div>

    <script>
        // --- ۱. منطق ماشین حساب ---
        let currentOperand = '0';
        let previousOperand = '';
        let operation = undefined;

        const currentOperandElement = document.getElementById('current-operand');
        const previousOperandElement = document.getElementById('previous-operand');

        function updateDisplay() {
            currentOperandElement.innerText = currentOperand;
            if (operation != null) {
                previousOperandElement.innerText = `${previousOperand} ${operation}`;
            } else {
                previousOperandElement.innerText = '';
            }
        }

        function clearAll() {
            currentOperand = '0';
            previousOperand = '';
            operation = undefined;
            updateDisplay();
        }

        function deleteNumber() {
            if (currentOperand === '0') return;
            currentOperand = currentOperand.toString().slice(0, -1);
            if (currentOperand === '') currentOperand = '0';
            updateDisplay();
        }

        function appendNumber(number) {
            if (number === '.' && currentOperand.includes('.')) return;
            if (currentOperand === '0' && number !== '.') {
                currentOperand = number.toString();
            } else {
                currentOperand = currentOperand.toString() + number.toString();
            }
            updateDisplay();
        }

        function chooseOperation(op) {
            if (currentOperand === '') return;
            if (previousOperand !== '') {
                calculate();
            }
            operation = op === '*' ? '×' : (op === '/' ? '÷' : op);
            previousOperand = currentOperand;
            currentOperand = '0';
            updateDisplay();
        }

        function calculate() {
            let computation;
            const prev = parseFloat(previousOperand);
            const current = parseFloat(currentOperand);
            if (isNaN(prev) || isNaN(current)) return;

            let mathOp = operation === '×' ? '*' : (operation === '÷' ? '/' : operation);

            switch (mathOp) {
                case '+': computation = prev + current; break;
                case '-': computation = prev - current; break;
                case '*': computation = prev * current; break;
                case '/':
                    if (current === 0) {
                        alert('تقسیم بر صفر ممکن نیست!');
                        clearAll();
                        return;
                    }
                    computation = prev / current;
                    break;
                default: return;
            }

            currentOperand = Math.round(computation * 100000000) / 100000000;
            operation = undefined;
            previousOperand = '';
            updateDisplay();
        }

        updateDisplay();

        // --- ۲. ثبت Service Worker برای کارکرد آفلاین و PWA ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(registration => console.log('ServiceWorker registered'))
                .catch(err => console.log('ServiceWorker registration failed: ', err));
            });
        }
    </script>
</body>
</html>
